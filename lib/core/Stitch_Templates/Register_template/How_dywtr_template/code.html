<div class="flex justify-between items-center px-gutter h-16 w-full max-w-7xl mx-auto">

<button class="text-on-surface-variant hover:opacity-80 active:scale-95 transition-all">

</button>
</div>
</header>

<div class="w-full max-w-4xl mx-auto">
<!-- Header Section -->
<div class="text-center mb-stack-lg">
<h1 class="font-display-lg text-display-lg text-primary mb-stack-sm">How do you want to register?</h1>
<p class="font-body-lg text-on-surface-variant max-w-lg mx-auto">Choose the account type that best describes your goals in the water credit ecosystem.</p>
</div>

<!-- Card 1: Retail Investor (Active/Selected State Example) -->

<span class="material-symbols-outlined text-secondary" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<div class="mb-stack-md w-16 h-16 rounded-xl bg-secondary/10 flex items-center justify-center text-secondary">
<span class="material-symbols-outlined text-[40px]">person</span>
</div>
<div class="mt-auto">
<h3 class="font-headline-md text-headline-md text-primary mb-unit">Retail Investor</h3>
<p class="font-body-md text-on-surface-variant">Explore and invest in water credits</p>
</div>
<div class="mt-stack-md pt-stack-md border-t border-outline-variant/20 grid grid-cols-2 gap-2">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-secondary text-sm">show_chart</span>
<span class="text-[12px] font-label-sm text-on-surface-variant">Micro-investments</span>
</div>
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-secondary text-sm">account_balance_wallet</span>
<span class="text-[12px] font-label-sm text-on-surface-variant">Digital Wallet</span>
</div>
</div>

</div>
</button>

<div class="mb-stack-md w-16 h-16 rounded-xl bg-primary/5 flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-[40px]">corporate_fare</span>
</div>
<div class="mt-auto">

</div>
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-secondary text-sm">pie_chart</span>

                    Continue with Registration
